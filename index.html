<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>altair — terminal</title>
<style>
  :root {
    --font: "JetBrains Mono", "Cascadia Mono", "Fira Mono", "Menlo", "Consolas", monospace;
  }
  body[data-theme="amber"] {
    --bg: #16100a; --panel: #1d150c; --ink: #ffb000; --dim: #9a6c10;
    --bright: #ffd569; --accent: #ff8c1a; --glow: rgba(255,176,0,.45);
    --bar: #241a0e; --chipbg: #241a0e; --scan: rgba(255,176,0,.03);
  }
  body[data-theme="green"] {
    --bg: #050d08; --panel: #08120b; --ink: #4affa0; --dim: #1f7a4d;
    --bright: #b8ffd9; --accent: #7dffc4; --glow: rgba(74,255,160,.45);
    --bar: #0a1810; --chipbg: #0a1810; --scan: rgba(74,255,160,.03);
  }
  body[data-theme="ice"] {
    --bg: #060b14; --panel: #081120; --ink: #7fd4ff; --dim: #2e6d94;
    --bright: #d8f3ff; --accent: #4aa8ff; --glow: rgba(127,212,255,.45);
    --bar: #0a1626; --chipbg: #0a1626; --scan: rgba(127,212,255,.03);
  }
  body[data-theme="plasma"] {
    --bg: #0c0714; --panel: #130a20; --ink: #c792ff; --dim: #6b4a99;
    --bright: #ecd9ff; --accent: #ff7ad9; --glow: rgba(199,146,255,.45);
    --bar: #180d28; --chipbg: #180d28; --scan: rgba(199,146,255,.03);
  }
  body[data-theme="ruby"] {
    --bg: #120608; --panel: #1c080c; --ink: #ff6b7a; --dim: #8f3040;
    --bright: #ffc4cb; --accent: #ffa03c; --glow: rgba(255,107,122,.45);
    --bar: #240a10; --chipbg: #240a10; --scan: rgba(255,107,122,.03);
  }
  body[data-theme="paper"] {
    --bg: #efe8d8; --panel: #f6f0e2; --ink: #2c2822; --dim: #8a8272;
    --bright: #000; --accent: #8a4b2a; --glow: rgba(0,0,0,0);
    --bar: #e4dcc8; --chipbg: #e4dcc8; --scan: rgba(0,0,0,.015);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: clamp(14px, 3.6vw, 16px);
    line-height: 1.55;
    display: flex; flex-direction: column;
    transition: background .35s, color .35s;
    -webkit-font-smoothing: antialiased;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px);
  }
  body[data-theme="paper"]::after { background: none; }

  #bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: var(--bar);
    border-bottom: 1px solid var(--dim);
    position: sticky; top: 0; z-index: 20;
  }
  .dots { display: flex; gap: 5px; margin-right: 4px; }
  .dots span { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--dim); opacity: .8; }
  #bar .title { flex: 1; color: var(--dim); font-size: .8em; letter-spacing: .05em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barbtn {
    font-family: var(--font); font-size: .78em;
    background: transparent; color: var(--ink);
    border: 1px solid var(--dim); border-radius: 4px;
    padding: 4px 9px; cursor: pointer; white-space: nowrap;
  }
  .barbtn:hover, .barbtn:focus-visible { color: var(--bright); border-color: var(--ink); outline: none; }

  #term {
    flex: 1; overflow-y: auto; padding: 18px 16px 26px;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .cmdline { color: var(--dim); margin: 4px 0 12px; }
  .cmdline .ps { color: var(--accent); }
  .cmdline .typed { color: var(--bright); }
  .cursor {
    display: inline-block; width: .55em; height: 1.05em;
    background: var(--ink); vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .line {
    opacity: 0; transform: translateY(6px);
    animation: rise .45s ease forwards;
    min-height: 1.55em; overflow-wrap: break-word;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .line.h {
    color: var(--bright); font-weight: 700;
    letter-spacing: .04em; margin: 10px 0 6px;
    text-shadow: 0 0 12px var(--glow);
  }
  .line.dim { color: var(--dim); }
  .line.sys { color: var(--accent); }

  .tailpiece {
    margin: 34px 0 14px; text-align: center;
    opacity: 0; animation: artin .8s ease forwards;
  }
  @keyframes artin { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .tailpiece pre {
    display: inline-block; text-align: left;
    font-family: var(--font);
    font-size: clamp(9px, 2.9vw, 16px);
    line-height: 1.25;
    color: var(--ink);
    text-shadow: 0 0 10px var(--glow);
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .78; } 50% { opacity: 1; } }
  body[data-theme="paper"] .tailpiece pre { animation: none; text-shadow: none; }

  #dock {
    position: sticky; bottom: 0; z-index: 20;
    background: var(--bar);
    border-top: 1px solid var(--dim);
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  }
  #inputrow { display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 auto 8px; }
  #inputrow .ps { color: var(--accent); }
  #cmd {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--bright); font-family: var(--font); font-size: 1em;
    caret-color: var(--accent);
  }
  #cmd::placeholder { color: var(--dim); opacity: .7; }
  #chips { display: flex; flex-wrap: wrap; gap: 7px; max-width: 720px; margin: 0 auto; }
  .chip {
    font-family: var(--font); font-size: .82em;
    background: var(--chipbg); color: var(--ink);
    border: 1px solid var(--dim); border-radius: 999px;
    padding: 5px 13px; cursor: pointer;
  }
  .chip:hover, .chip:focus-visible { color: var(--bright); border-color: var(--ink); outline: none; }
  .chip.on {
    color: var(--bg); background: var(--ink); border-color: var(--ink);
    text-shadow: none; font-weight: 700;
  }

  @media (prefers-reduced-motion: reduce) {
    .line, .tailpiece { animation-duration: .01s !important; }
    .tailpiece pre { animation: none; }
    .cursor { animation: none; }
  }
</style>
</head>
<body data-theme="amber">

<div id="bar">
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="title">altair@sky:~</div>
  <button class="barbtn" id="themebtn" type="button"></button>
  <button class="barbtn" id="langbtn" type="button"></button>
</div>

<div id="term" aria-live="polite"></div>

<div id="dock">
  <div id="inputrow">
    <span class="ps">&gt;</span>
    <input id="cmd" autocomplete="off" autocapitalize="none" spellcheck="false"
           placeholder="type a command… (help)">
  </div>
  <div id="chips"></div>
</div>

<script>
/* =====================================================================
   ВЕСЬ ТЕКСТ ЖИВЁТ В content.ru.md И content.en.md — редактируй их.
   Ниже — встроенная резервная копия на случай, если файлы не
   загрузились (например, при открытии HTML локально).
   ===================================================================== */

const FALLBACK_RU = `
=== home
label: дом

# Альтаир

Тестовый текст: пара строк о том, кто я.
Например: языки, код, философия — в таком духе.

— заменить этот текст в content.ru.md —

=== code
label: код

# Код

Тестовый текст про Python: автоматизация,
веб-скрейпинг, статистика.

Тестовый текст: что умею, чем пользовался,
пример задачи, которую решал.

=== langs
label: языки

# Языки

русский · родной
english · свободно
čeština · учу, примерно B1–B2

Тестовый текст: преподавание, Preply,
лингвистика как страсть.

=== projects
label: проекты

# Проекты

Тестовый текст: языковые игры,
обучающие страницы, этот сайт.

Тестовый текст: ссылка · описание
Тестовый текст: ссылка · описание

=== contact
label: контакт

# Контакт

почта    · тест@пример.кз
telegram · @тест
github   · altairsky

Тестовый текст: короткая фраза-приглашение.
`;

const FALLBACK_EN = `
=== home
label: home

# Altair

Test text: a couple of lines about who I am.
Say: languages, code, philosophy — that kind of thing.

— replace this text in content.en.md —

=== code
label: code

# Code

Test text about Python: automation,
web scraping, statistics.

Test text: what I can do, tools I've used,
an example of a problem I solved.

=== langs
label: languages

# Languages

русский · native
english · fluent
čeština · learning, roughly B1–B2

Test text: teaching, Preply,
linguistics as a passion.

=== projects
label: projects

# Projects

Test text: language games,
learning pages, this site.

Test text: link · description
Test text: link · description

=== contact
label: contact

# Contact

email    · test@example.kz
telegram · @test
github   · altairsky

Test text: a short closing invitation.
`;

/* ---------- terminal commands: always English ---------- */
const CMDS = {
  home: "whoami",
  code: "cat code/",
  langs: "ls languages/",
  projects: "ls projects/",
  contact: "ping altair"
};
function cmdFor(id) { return CMDS[id] || ("cat " + id + "/"); }

/* ---------- ASCII LANDSCAPES (tailpieces) ---------- */
const ART = {"home": "\n                            \\ | /\n            v             -- (_) --\n       v         v          / | \\\n                   /\\\n                  /..\\\n         /\\      /    \\      /\\\n        /..\\    /      \\    /..\\\n       /    \\  /        \\  /    \\      /\\\n      /      \\/          \\/      \\    /..\\\n   /\\/                            \\  /    \\\n__/                                \\/      \\__\n", "code": "\n       *          .              +\n   .        +          *      .\n           .   _.-\"\"-._\n      *       /  o   . \\      *     .\n   +         |     .    |\n              \\ o    . /     *\n        .      '-.__.-'   .        +\n                              *\n     *      .        *          .\n       _                         _\n    __/ \\     /\\       /\\    ___/ \\___\n __/     \\   /||\\     /||\\  /         \\__\n/         \\_/ || \\___/ || \\/             \\\n", "langs": "\n                   .--~~--.\n         v        (        )          v  v\n   v               `--__--'\n              v                  v\n                          v\n     .          .         .          .\n  _______________________________________\n    \\|/    ,   \\|/   .  ,,   \\|/   ,  \\|/\n   ,,,,,, ., ,,,,,,,  ,, ,.,,,,,,,., ,,,,,\n    ,  ., ,.  ,, . ,   ,, ., , .  ,, .,\n", "projects": "\n          .--.         ~          v\n         (    )             v\n          `--'       |\\\n                     | \\\n                     |  \\\n                     |   \\\n                 /|  |    \\\n                / |  |     \\\n               /  |  |      \\\n              /___|  |_______\\\n           __________|______________\n      ~~ ~ \\    o    o    o        / ~ ~~\n   ~   ~~   \\_____________________/   ~   ~~\n ~~     ~  ~~    ~      ~      ~~    ~     ~\n", "contact": "\n      .        *         .       *\n   ____________________________________\n               /    .    \\         +\n              /     |     \\       -+-\n       |     /      .      \\       |\n      -+-   /       |       \\      |\n       |   /        .        \\     |\n       |  /         |         \\    |\n       | /          .          \\   |\n       |/           |           \\  |\n"};

/* ---------- chrome strings: always English ---------- */
const THEMES = ["amber", "green", "ice", "plasma", "ruby", "paper"];
const HELP = [
  "# commands",
  "",
  "home · code · languages · projects · contact",
  "theme · switch color theme",
  "lang  · switch language (RU/EN)",
  "help  · this list",
  "",
  "…or just tap the buttons below."
];
const HIRE = [
  "# sudo hire",
  "",
  "[sudo] password accepted.",
  "checking candidate… ok",
  "common sense… found",
  "sense of humor… detected",
  "",
  "recommendation: hire. see contact."
];

/* aliases -> page id or action (English canon; Russian accepted quietly) */
const ALIASES = {
  "home": "home", "дом": "home",
  "code": "code", "код": "code",
  "languages": "langs", "langs": "langs", "языки": "langs",
  "projects": "projects", "проекты": "projects",
  "contact": "contact", "контакт": "contact", "контакты": "contact",
  "help": ":help", "помощь": ":help", "?": ":help",
  "theme": ":theme", "тема": ":theme",
  "lang": ":lang", "язык": ":lang", "en": ":lang", "ru": ":lang",
  "sudo hire": ":hire"
};

/* ---------- markdown-ish parser ---------- */
/* формат: блоки начинаются со строки "=== id";
   затем необязательные строки "label: …" и "caption: …";
   всё остальное до следующего "===" — текст страницы как есть. */
function parseContent(text) {
  const pages = {};
  const order = [];
  const parts = text.split(/^===[ \t]*/m).slice(1);
  for (const part of parts) {
    const lines = part.split(/\r?\n/);
    const id = (lines.shift() || "").trim();
    if (!id) continue;
    const page = { label: null, caption: null, lines: [] };
    while (lines.length) {
      const m = lines[0].match(/^(label|caption)[ \t]*:[ \t]*(.*)$/);
      if (m) { page[m[1]] = m[2].trim(); lines.shift(); }
      else break;
    }
    while (lines.length && lines[0].trim() === "") lines.shift();
    while (lines.length && lines[lines.length - 1].trim() === "") lines.pop();
    page.lines = lines;
    pages[id] = page;
    order.push(id);
  }
  return { pages, order };
}

/* ---------- STATE ---------- */
let RU = parseContent(FALLBACK_RU);
let EN = parseContent(FALLBACK_EN);
let LANG = localStorage.getItem("resume-lang") || "ru";
let THEME = localStorage.getItem("resume-theme") || "amber";
if (!THEMES.includes(THEME)) THEME = "amber";
let CURRENT = "home";
let seq = 0;

const term = document.getElementById("term");
const chips = document.getElementById("chips");
const cmdInput = document.getElementById("cmd");
const themeBtn = document.getElementById("themebtn");
const langBtn = document.getElementById("langbtn");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function primary()  { return LANG === "ru" ? RU : EN; }
function fallback() { return LANG === "ru" ? EN : RU; }
function pageIds() {
  const seen = new Set(RU.order);
  return RU.order.concat(EN.order.filter(id => !seen.has(id)));
}
function getPage(id) {
  const p = primary().pages[id], f = fallback().pages[id];
  if (!p && !f) return null;
  return {
    label:   (p && p.label)   || (f && f.label)   || id,
    caption: (p && p.caption) || (f && f.caption) || "",
    lines:   (p && p.lines && p.lines.length) ? p.lines : ((f && f.lines) || [])
  };
}

/* ---------- CHROME ---------- */
function applyTheme() {
  document.body.dataset.theme = THEME;
  themeBtn.textContent = "theme: " + THEME;
  localStorage.setItem("resume-theme", THEME);
}
function applyLang() {
  document.documentElement.lang = LANG;
  langBtn.textContent = LANG === "ru" ? "EN" : "RU";
  localStorage.setItem("resume-lang", LANG);
  buildChips();
}
function buildChips() {
  chips.innerHTML = "";
  for (const id of pageIds()) {
    const page = getPage(id);
    if (!page) continue;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (id === CURRENT ? " on" : "");
    b.textContent = page.label;
    b.onclick = () => showPage(id);
    chips.appendChild(b);
  }
}

/* ---------- RENDER ---------- */
function lineEl(text, delay) {
  const d = document.createElement("div");
  d.className = "line";
  if (text.startsWith("# ")) { d.classList.add("h"); text = text.slice(2); }
  else if (text.startsWith("— ") || text.startsWith("-- ")) { d.classList.add("dim"); }
  d.textContent = text === "" ? "\u00a0" : text;
  d.style.animationDelay = delay + "ms";
  return d;
}
async function typeCommand(cmdText, mySeq) {
  const row = document.createElement("div");
  row.className = "cmdline";
  const ps = document.createElement("span");
  ps.className = "ps"; ps.textContent = "$ ";
  const typed = document.createElement("span");
  typed.className = "typed";
  const cur = document.createElement("span");
  cur.className = "cursor";
  row.append(ps, typed, cur);
  term.appendChild(row);
  if (reduced) { typed.textContent = cmdText; cur.remove(); return; }
  for (const ch of cmdText) {
    if (mySeq !== seq) return;
    typed.textContent += ch;
    await new Promise(r => setTimeout(r, 34 + Math.random() * 40));
  }
  cur.remove();
}
async function renderLines(lines, mySeq, startDelay) {
  let delay = startDelay;
  for (const t of lines) {
    if (mySeq !== seq) return delay;
    term.appendChild(lineEl(t, delay));
    delay += 90;
  }
  return delay;
}
function addTailpiece(artKey, delay) {
  if (!ART[artKey]) return;
  const wrap = document.createElement("div");
  wrap.className = "tailpiece";
  wrap.style.animationDelay = delay + "ms";
  const pre = document.createElement("pre");
  pre.textContent = ART[artKey].replace(/^\n/, "").replace(/\n\s*$/, "");
  wrap.appendChild(pre);
  term.appendChild(wrap);
}
async function showPage(id) {
  const page = getPage(id);
  if (!page) return;
  CURRENT = id;
  seq++;
  const mySeq = seq;
  term.innerHTML = "";
  buildChips();
  await typeCommand(cmdFor(id), mySeq);
  if (mySeq !== seq) return;
  const d = await renderLines(page.lines, mySeq, 60);
  if (mySeq !== seq) return;
  addTailpiece(id, d + 250);
  term.scrollTop = 0;
}
async function showSystem(lines) {
  seq++;
  const mySeq = seq;
  term.innerHTML = "";
  buildChips();
  await renderLines(lines, mySeq, 0);
}

/* ---------- COMMANDS ---------- */
function runCommand(raw) {
  const c = raw.trim().toLowerCase();
  if (!c) return;
  const target = ALIASES[c];
  if (target === ":help")  { showSystem(HELP); return; }
  if (target === ":hire")  { showSystem(HIRE); return; }
  if (target === ":theme") { cycleTheme(); return; }
  if (target === ":lang")  { toggleLang(); return; }
  if (target) { showPage(target); return; }
  if (getPage(c)) { showPage(c); return; }
  seq++;
  const d = document.createElement("div");
  d.className = "line sys";
  d.style.animationDelay = "0ms";
  d.textContent = "command not found: " + c + " — type 'help'";
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
}
function cycleTheme() {
  THEME = THEMES[(THEMES.indexOf(THEME) + 1) % THEMES.length];
  applyTheme();
}
function toggleLang() {
  LANG = LANG === "ru" ? "en" : "ru";
  applyLang();
  showPage(CURRENT);
}
themeBtn.onclick = cycleTheme;
langBtn.onclick = toggleLang;
cmdInput.addEventListener("keydown", e => {
  if (e.key === "Enter") { runCommand(cmdInput.value); cmdInput.value = ""; }
});

/* ---------- BOOT ---------- */
async function loadMD(name) {
  try {
    const res = await fetch(name, { cache: "no-store" });
    if (!res.ok) return null;
    return parseContent(await res.text());
  } catch (e) { return null; }
}
async function boot() {
  const [ru, en] = await Promise.all([loadMD("content.ru.md"), loadMD("content.en.md")]);
  if (ru && ru.order.length) RU = ru;
  if (en && en.order.length) EN = en;
  applyTheme();
  applyLang();
  showPage("home");
}
boot();
</script>
</body>
</html>
